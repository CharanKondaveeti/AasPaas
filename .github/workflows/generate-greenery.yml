name: Generate illustrated Hyderabad scenery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-greenery.yml
      - scripts/generate-map-scenery.mjs

permissions:
  contents: write

concurrency:
  group: hyderabad-illustration-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate stable tree coordinates in mapped green areas
        run: node scripts/generate-map-scenery.mjs
      - name: Validate generated geometry
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const collection=JSON.parse(readFileSync("public/map-data/trees.geojson","utf8"));
            if(collection.type!=="FeatureCollection" || collection.features.length<30 || collection.features.length>3200) process.exit(1);
            for(const f of collection.features) {
              const [lng,lat]=f.geometry.coordinates;
              if(lng<78.15 || lng>78.85 || lat<17.15 || lat>17.65 || f.properties.placement!=="boundary") process.exit(1);
            }
            console.log("Geographic park-boundary greenery points:",collection.features.length);
          '
      - name: Commit generated map scenery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/map-data/trees.geojson
          if ! git diff --cached --quiet; then
            git commit -m "data(map): place illustrated trees along Hyderabad park boundaries"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
